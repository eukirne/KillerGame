<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#1cc29f"/>
<title>SplitShare — Share expenses, split fair</title>
<meta name="description" content="Split bills and track shared expenses with friends, roommates and groups."/>
<link rel="stylesheet" href="css/style.css"/>

<link rel="manifest" href="/manifest.json"/>
<link rel="icon" href="/icons/favicon-32.png" type="image/png"/>
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="SplitShare"/>
<meta name="mobile-web-app-capable" content="yes"/>
</head>
<body>

<div id="auth-screen" class="auth-screen hidden">
  <div class="auth-card">
    <div class="auth-brand">Split<span>Share</span></div>
    <div id="auth-error" class="auth-error hidden"></div>
    <form id="login-form" class="auth-form">
      <h2>Welcome back</h2>
      <label>Email<input type="email" id="login-email" required autocomplete="email"/></label>
      <label>Password<input type="password" id="login-password" required autocomplete="current-password"/></label>
      <button type="submit" class="btn btn-primary btn-block">Log in</button>
      <p class="auth-switch">New here? <a href="#" id="show-signup">Create an account</a></p>
    </form>
    <form id="signup-form" class="auth-form hidden">
      <h2>Create your account</h2>
      <label>Name<input type="text" id="signup-name" required autocomplete="name"/></label>
      <label>Email<input type="email" id="signup-email" required autocomplete="email"/></label>
      <label>Password<input type="password" id="signup-password" required minlength="6" autocomplete="new-password"/></label>
      <button type="submit" class="btn btn-primary btn-block">Sign up</button>
      <p class="auth-switch">Already have an account? <a href="#" id="show-login">Log in</a></p>
    </form>
  </div>
</div>

<div id="app-shell" class="app-shell hidden">
  <aside class="sidebar">
    <div class="brand">Split<span>Share</span></div>
    <nav class="side-nav">
      <a href="#/dashboard" data-route="dashboard">Dashboard</a>
      <a href="#/groups" data-route="groups">Groups</a>
      <a href="#/friends" data-route="friends">Friends</a>
      <a href="#/activity" data-route="activity">Activity</a>
    </nav>
    <button id="add-expense-btn" class="btn btn-primary btn-block add-expense-fab">+ Add expense</button>
    <div class="side-footer">
      <div id="user-chip" class="user-chip"></div>
      <button id="logout-btn" class="btn-link">Log out</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div id="page-title" class="page-title">Dashboard</div>
      <div class="topbar-actions">
        <button id="new-group-btn" class="btn btn-secondary">New group</button>
        <button id="add-friend-btn" class="btn btn-secondary">Add friend</button>
      </div>
    </header>
    <div id="view-root" class="view-root"></div>
  </main>
</div>

<div id="modal-root"></div>
<div id="toast-root" class="toast-root"></div>

<script src="js/api.js"></script>
<script src="js/format.js"></script>
<script src="js/modal.js"></script>
<script src="js/expenseModal.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
